<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Demo Night &middot; ticket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* 1080x1350. Render: bash scripts/render-post-graphic.sh demo-night-ticket

     A ticket, because the scarcity the reader actually feels is the seat, not
     the stage spot. The blank seat line is the whole idea: one of the hundred
     is unclaimed and it is theirs. Notched corners and a tear line are the
     only place this brand gets to break its no-rounded-corners rule. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ground: #e7e4dc; --paper: #f9f8f5; --ink: #110465;
    --ink-soft: #4b4470; --pink: #cf5b8d; --rule: #cfc9d9;
  }
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--ground); color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }

  .ticket {
    position: relative; width: 916px;
    background: var(--paper); border: 5px solid var(--ink);
    transform: rotate(-1.4deg);
    display: flex; flex-direction: column;
  }

  /* Tear line, with a punched notch biting in from each edge */
  .tear { position: relative; height: 0;
    border-top: 5px dashed var(--rule); }
  .notch { position: absolute; top: -37px; width: 68px; height: 68px;
    border-radius: 50%; background: var(--ground);
    border: 5px solid var(--ink); }
  .notch.l { left: -39px; }
  .notch.r { right: -39px; }

  .body-sec { padding: 46px 54px 40px; display: flex; flex-direction: column; }

  .row { display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;
    letter-spacing: 0.19em; text-transform: uppercase; color: var(--ink-soft); }

  .row .mark { width: 208px; height: 68px;
    background: url("techunited-logo.png") left center / contain no-repeat; }

  h1 { margin-top: 26px;
    font-family: 'Archivo Narrow', sans-serif; font-weight: 700;
    font-size: 138px; line-height: 0.82; letter-spacing: -0.02em;
    text-transform: uppercase; }
  h1 .accent { color: var(--pink); display: block; }

  .when { margin-top: 34px; padding-top: 26px; border-top: 4px solid var(--ink);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .when .date { font-family: 'Archivo Narrow', sans-serif; font-weight: 700;
    font-size: 96px; line-height: 0.84; letter-spacing: -0.02em; text-transform: uppercase; }
  .when .where { text-align: right; font-family: 'JetBrains Mono', monospace;
    font-size: 16px; line-height: 1.75; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); }
  .when .where b { color: var(--ink); font-weight: 700; }

  /* The reason to hurry, stamped on at an angle */
  .stamp { align-self: flex-start; margin-top: 40px;
    transform: rotate(-4.5deg);
    border: 4px solid var(--pink); padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--pink);
    line-height: 1.35; text-align: center; }
  .stamp span { display: block; }

  .fill { height: 44px; }

  .fields { display: flex; border-top: 1px solid var(--rule); }
  .fields div { flex: 1; padding: 20px 18px 0 0; border-right: 1px solid var(--rule); }
  .fields div:last-child { border-right: none; padding-right: 0; padding-left: 20px; }
  .fields .k { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--pink); margin-bottom: 9px; }
  .fields .v { font-size: 23px; font-weight: 600; line-height: 1.22; }
  .fields .v em { font-style: normal; color: var(--ink-soft); font-weight: 500; }

  /* Stub */
  .stub { padding: 40px 54px 42px; display: flex;
    justify-content: space-between; align-items: flex-end; gap: 30px; }
  .stub .seat .k { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft); }
  .stub .seat .line { margin-top: 14px; display: flex; align-items: baseline; gap: 16px;
    font-family: 'Archivo Narrow', sans-serif; font-weight: 700; font-size: 76px;
    line-height: 1; text-transform: uppercase; }
  .stub .seat .blank { display: inline-block; width: 132px;
    border-bottom: 6px solid var(--pink); height: 62px; }
  .stub .seat .of { color: var(--ink-soft); font-size: 46px; }
  .stub .rsvp { text-align: right; }
  .stub .rsvp .big { font-family: 'Archivo Narrow', sans-serif; font-weight: 700;
    font-size: 82px; line-height: 0.86; letter-spacing: -0.02em;
    text-transform: uppercase; color: var(--pink); }
  .stub .rsvp .sub { margin-top: 10px; font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); }
  .stub .rsvp .sub b { color: var(--ink); font-weight: 700; }

  .logo { position: absolute; left: 54px; bottom: 0; width: 0; height: 0; }
</style>
</head>
<body>
<div class="ticket">

  <div class="body-sec">
    <div class="row">
      <span class="mark"></span>
      <span>Admit one</span>
    </div>

    <h1>AI Demo<span class="accent">Night</span></h1>

    <div class="when">
      <div class="date">Sept 10</div>
      <div class="where">
        <b>Apprentice.IO</b><br>
        Jersey City
      </div>
    </div>

    <div class="stamp">
      100 companies applied in 24 hours
      <span>3 of them are pitching</span>
    </div>

    <div class="fill"></div>

    <div class="fields">
      <div>
        <p class="k">On stage</p>
        <p class="v">3 companies<br><em>Still under wraps</em></p>
      </div>
      <div>
        <p class="k">The format</p>
        <p class="v">5 min pitch<br><em>Plus 5 min live Q&amp;A</em></p>
      </div>
      <div>
        <p class="k">The room</p>
        <p class="v">100 people<br><em>Founders, operators, investors</em></p>
      </div>
    </div>
  </div>

  <div class="tear">
    <div class="notch l"></div>
    <div class="notch r"></div>
  </div>

  <div class="stub">
    <div class="seat">
      <div class="k">Seat no.</div>
      <div class="line"><span class="blank"></span><span class="of">of 100</span></div>
    </div>
    <div class="rsvp">
      <div class="big">RSVP</div>
      <div class="sub">Link in the <b>comments</b></div>
    </div>
  </div>

</div>
</body>
</html>
