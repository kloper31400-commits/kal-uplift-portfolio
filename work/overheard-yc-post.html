<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overheard on the Job — YC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; }
  body {
    background:#efefef;
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
  }

  .card {
    width:960px; height:1080px;
    background:#fff;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 84px;
  }

  .head { display:flex; align-items:center; gap:22px; margin-bottom:44px; }

  .avatar {
    width:92px; height:92px; border-radius:50%;
    background:#e4d9c3;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .avatar span {
    font-family:'Playfair Display', Georgia, serif;
    font-weight:900; font-size:31px; color:#000;
    letter-spacing:0.005em; line-height:1;
    transform:translateY(-2px);
  }

  .who { display:flex; flex-direction:column; gap:4px; }
  .name {
    display:flex; align-items:center; gap:9px;
    font-size:35px; font-weight:700; color:#0f1419; letter-spacing:-0.015em;
  }
  .badge { width:31px; height:31px; flex-shrink:0; }
  .handle { font-size:33px; font-weight:400; color:#6b7280; letter-spacing:-0.01em; }

  .body {
    font-size:41px; line-height:1.42; color:#0f1419;
    letter-spacing:-0.014em; font-weight:400;
  }
  .body p + p { margin-top:34px; }
  .speaker { font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="avatar"><span>OTJ</span></div>
      <div class="who">
        <div class="name">
          Overheard on the Job
          <svg class="badge" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.816.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/>
          </svg>
        </div>
        <div class="handle">@overheardonthejob</div>
      </div>
    </div>

    <div class="body">
      <p><span class="speaker">Founder:</span> “Have you ever heard of Y Combinator?”</p>
      <p><span class="speaker">Me:</span> “Yes.”</p>
      <p><span class="speaker">Founder:</span> “You should try being more like them.”</p>
    </div>
  </div>
</body>
</html>
