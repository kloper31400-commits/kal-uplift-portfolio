<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overheard on the Job — YC tweet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; }
  body {
    background:#e9eaec;
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .tweet {
    width:1000px;
    background:#fff;
    border:1px solid #eff3f4;
    border-radius:28px;
    box-shadow:0 3px 22px rgba(0,0,0,.07);
    padding:38px 40px 26px;
    color:#0f1419;
  }

  /* ---- header ---- */
  .head { display:flex; align-items:flex-start; gap:20px; }
  .avatar {
    width:84px; height:84px; border-radius:50%;
    background:#e4d9c3; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar span {
    font-family:'Playfair Display', Georgia, serif;
    font-weight:900; font-size:28px; color:#000; line-height:1;
    letter-spacing:.005em;
  }
  .who { flex:1; display:flex; flex-direction:column; gap:2px; padding-top:6px; }
  .name {
    display:flex; align-items:center; gap:8px;
    font-size:32px; font-weight:700; letter-spacing:-.015em; line-height:1.2;
  }
  .badge { width:28px; height:28px; flex-shrink:0; }
  .handle { font-size:31px; color:#536471; font-weight:400; letter-spacing:-.01em; }
  .more { color:#536471; padding-top:12px; }
  .more svg { width:33px; height:33px; }

  /* ---- body ---- */
  .body {
    margin-top:30px;
    font-size:41px; line-height:1.4; letter-spacing:-.014em;
  }
  .body p + p { margin-top:30px; }
  .speaker { font-weight:700; }

  /* ---- meta ---- */
  .meta {
    margin-top:32px; padding-bottom:24px;
    font-size:30px; color:#536471; letter-spacing:-.01em;
  }
  .meta b { color:#0f1419; font-weight:700; }
  .dot { padding:0 8px; }

  .rule { height:1px; background:#eff3f4; }

  .stats {
    display:flex; gap:38px; flex-wrap:wrap;
    padding:24px 0; font-size:29px; color:#536471; letter-spacing:-.01em;
  }
  .stats b { color:#0f1419; font-weight:700; }

  /* ---- actions ---- */
  .actions {
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 30px 4px; color:#536471;
  }
  .act { display:flex; align-items:center; gap:12px; font-size:28px; letter-spacing:-.01em; }
  .act svg { width:34px; height:34px; }
  .act.liked { color:#f91880; }
</style>
</head>
